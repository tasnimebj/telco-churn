repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src/telco_churn/|tests/|scripts/)
        types_or: [python, pyi]
      - id: ruff-format
        files: ^(src/telco_churn/|tests/|scripts/)
        types_or: [python, pyi]
